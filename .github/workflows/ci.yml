name: Release checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline release gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          cache: true
      - name: Install pinned OpenCode V2 test host
        shell: bash
        run: |
          pixi run --locked npm install --prefix "$RUNNER_TEMP/opencode-host" --no-audit --no-fund @opencode/cli@2.0.18
          echo "$RUNNER_TEMP/opencode-host/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run offline release gates (no subscription credentials)
        run: pixi run --locked release-check
      - name: Build source download and checksum
        run: pixi run --locked release-archive
      - name: Upload release evidence and source download
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-check-${{ matrix.os }}
          path: |
            test-results/release-check.json
            test-results/release/
          if-no-files-found: warn
          retention-days: 14
